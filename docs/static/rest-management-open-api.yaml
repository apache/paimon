openapi: 3.1.1
info:
  title: Paimon REST Management API
  version: 0.4.0
  description: |
    Experimental control-plane extension for permissions, table row filters, and table column
    masks in one Paimon REST Catalog prefix. A data policy restricts an already-authorized read;
    it never grants SELECT by itself. Each policy is attached to one principal: a principal has at
    most one row filter per table and at most one mask per table column. Policy creation and
    replacement are accepted only when the target table exists, has `query-auth.enabled=true`, and
    the referenced principal, function, and columns are valid. Principal lifecycle, function
    implementation, audit, and persistence remain server responsibilities. This contract may evolve
    incompatibly while experimental.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
security:
  - BearerAuth: []
paths:
  /v1/{prefix}/permissions:
    parameters:
      - $ref: '#/components/parameters/Prefix'
    get:
      tags: [permission]
      summary: List permission assignments on an exact resource
      operationId: listPermissions
      description: |
        Direct assignments are returned by default. With `includeInherited=true`, the request
        still names one exact target and the server also returns effective views of ancestor
        `DESCENDANTS` assignments. An effective view uses the target in `resource`, `SELF` in
        `scope`, and the source attachment in `inheritedFrom`. Effective views must exclude expired
        assignments. Direct expired assignments may remain visible until server cleanup. Following
        the catalog pagination contract, an empty page terminates pagination and therefore must not
        carry a continuation token.
      parameters:
        - $ref: '#/components/parameters/ResourceTypeQuery'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/DatabaseQuery'
        - $ref: '#/components/parameters/TableQuery'
        - $ref: '#/components/parameters/FunctionQuery'
        - $ref: '#/components/parameters/ViewQuery'
        - $ref: '#/components/parameters/PrincipalQuery'
        - $ref: '#/components/parameters/AccessQuery'
        - $ref: '#/components/parameters/IncludeInherited'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/MaxResults'
      responses:
        '200':
          description: Permission assignments in stable pagination order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPermissionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/{prefix}/permissions/grant:
    parameters:
      - $ref: '#/components/parameters/Prefix'
    post:
      tags: [permission]
      summary: Grant or replace a permission assignment
      operationId: grantPermission
      description: |
        Creates an assignment or replaces the assignment with the same `resource`, `scope`,
        `access`, and `principal`. The referenced resource and principal must exist. Servers bind
        assignments to the resource lifecycle described by `PermissionResource`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantPermissionRequest'
      responses:
        '200':
          description: Permission assignment created or replaced.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/{prefix}/permissions/revoke:
    parameters:
      - $ref: '#/components/parameters/Prefix'
    post:
      tags: [permission]
      summary: Idempotently revoke a permission assignment
      operationId: revokePermission
      description: |
        Makes the assignment absent. A 404 identifies a missing resource or principal, not an
        already-absent assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokePermissionRequest'
      responses:
        '200':
          description: Permission assignment is absent.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/{prefix}/databases/{database}/tables/{table}/policies:
    parameters:
      - $ref: '#/components/parameters/Prefix'
      - $ref: '#/components/parameters/Database'
      - $ref: '#/components/parameters/Table'
    get:
      tags: [policy]
      summary: List policies attached directly to a table
      operationId: listTablePolicies
      description: |
        Policies have no ancestor scope in this contract. Following the catalog pagination
        contract, an empty page terminates pagination and therefore must not carry a continuation
        token.
      parameters:
        - $ref: '#/components/parameters/PolicyTypeQuery'
        - $ref: '#/components/parameters/PrincipalQuery'
        - $ref: '#/components/parameters/PolicyColumnQuery'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/MaxResults'
      responses:
        '200':
          description: Table policies in stable pagination order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPoliciesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [policy]
      summary: Create a table policy
      operationId: createTablePolicy
      description: |
        Fails with 409 when the same principal already has a row filter or a mask on the same
        column, or when the table has not enabled query authorization. The principal, policy
        function, protected column, and column arguments are validated before persistence.
      requestBody:
        $ref: '#/components/requestBodies/PolicyRequest'
      responses:
        '200':
          description: Policy created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [policy]
      summary: Create or fully replace a table policy
      operationId: createOrReplaceTablePolicy
      description: |
        Upserts the policy identified by the body principal, definition type, and, for a column
        mask, `onColumn`. The same validation and `query-auth.enabled=true` requirement as create
        applies. Replacing one column mask does not replace masks on other columns.
      requestBody:
        $ref: '#/components/requestBodies/PolicyRequest'
      responses:
        '200':
          description: Policy created or fully replaced.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [policy]
      summary: Drop a table policy
      operationId: dropTablePolicy
      description: Returns 404 when the policy is absent; clients may expose idempotency explicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DropPolicyRequest'
      responses:
        '200':
          description: Policy dropped.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    Prefix:
      name: prefix
      in: path
      required: true
      description: Opaque REST catalog prefix returned by the catalog config endpoint.
      schema:
        type: string
        minLength: 1
    Database:
      name: database
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Table:
      name: table
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ResourceTypeQuery:
      name: resourceType
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/ResourceType'
    ScopeQuery:
      name: scope
      in: query
      schema:
        $ref: '#/components/schemas/PermissionScope'
    DatabaseQuery:
      name: database
      in: query
      schema:
        type: string
        minLength: 1
    TableQuery:
      name: table
      in: query
      schema:
        type: string
        minLength: 1
    FunctionQuery:
      name: function
      in: query
      schema:
        type: string
        minLength: 1
    ViewQuery:
      name: view
      in: query
      schema:
        type: string
        minLength: 1
    PrincipalQuery:
      name: principal
      in: query
      description: Exact opaque principal identifier.
      schema:
        $ref: '#/components/schemas/Principal'
    AccessQuery:
      name: access
      in: query
      schema:
        $ref: '#/components/schemas/PermissionAccess'
    IncludeInherited:
      name: includeInherited
      in: query
      schema:
        type: boolean
        default: false
    PolicyColumnQuery:
      name: column
      in: query
      description: Valid only together with `type=COLUMN_MASKING`.
      schema:
        type: string
        minLength: 1
    PolicyTypeQuery:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/PolicyType'
    PageToken:
      name: pageToken
      in: query
      description: Opaque continuation token returned by the preceding response.
      schema:
        type: string
    MaxResults:
      name: maxResults
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000

  requestBodies:
    PolicyRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicyRequest'

  responses:
    BadRequest:
      description: Invalid request shape, resource identity, function, signature, or column.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller cannot manage the target resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Referenced resource, principal, policy, or function does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Existing policy conflict or query authorization is not enabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Request rate limit exceeded; retry only according to server guidance.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Management service is temporarily unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  headers:
    RetryAfter:
      description: Delay before retrying, as HTTP delta-seconds or an HTTP date.
      schema:
        type: string

  schemas:
    ResourceType:
      type: string
      enum: [CATALOG, DATABASE, TABLE, FUNCTION, VIEW]
    PermissionScope:
      type: string
      enum: [SELF, DESCENDANTS]
    PermissionAccess:
      description: |
        Canonical access value. The REST wire format uses upper case. Values are either a built-in
        access or a namespaced server extension.
      oneOf:
        - type: string
          maxLength: 32
          enum:
            - USE_CATALOG
            - CREATE_DATABASE
            - USE_DATABASE
            - CREATE_TABLE
            - CREATE_VIEW
            - CREATE_FUNCTION
            - SELECT
            - INSERT
            - UPDATE
            - DELETE
            - ALTER
            - DROP
            - EXECUTE
            - MANAGE_PERMISSIONS
        - type: string
          maxLength: 32
          pattern: '^[A-Z0-9][A-Z0-9._-]*/[A-Z0-9][A-Z0-9._-]*$'
    PolicyType:
      type: string
      enum: [ROW_FILTER, COLUMN_MASKING]
    Principal:
      type: string
      minLength: 1
      maxLength: 128
      description: |
        Opaque, canonical, globally unique identifier in the server principal namespace. Type and
        membership resolution are server responsibilities.
    PermissionResource:
      description: |
        Exact catalog-scoped wire locator; fields not selected by type are invalid. Servers must
        bind stored direct assignments to a stable internal resource identity. Renaming a database,
        table, function, or view retains its direct assignments and responses use the new locator.
        Dropping a resource removes its direct assignments, and recreating the same locator must not
        inherit them. A child rename does not affect a CATALOG or DATABASE `DESCENDANTS` assignment.
      oneOf:
        - $ref: '#/components/schemas/CatalogResource'
        - $ref: '#/components/schemas/DatabaseResource'
        - $ref: '#/components/schemas/TableResource'
        - $ref: '#/components/schemas/FunctionResource'
        - $ref: '#/components/schemas/ViewResource'
      discriminator:
        propertyName: type
        mapping:
          CATALOG: '#/components/schemas/CatalogResource'
          DATABASE: '#/components/schemas/DatabaseResource'
          TABLE: '#/components/schemas/TableResource'
          FUNCTION: '#/components/schemas/FunctionResource'
          VIEW: '#/components/schemas/ViewResource'
    CatalogResource:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: CATALOG
    DatabaseResource:
      type: object
      additionalProperties: false
      required: [type, database]
      properties:
        type:
          const: DATABASE
        database:
          type: string
          minLength: 1
    TableResource:
      type: object
      additionalProperties: false
      required: [type, database, table]
      properties:
        type:
          const: TABLE
        database:
          type: string
          minLength: 1
        table:
          type: string
          minLength: 1
    FunctionResource:
      type: object
      additionalProperties: false
      required: [type, database, function]
      properties:
        type:
          const: FUNCTION
        database:
          type: string
          minLength: 1
        function:
          type: string
          minLength: 1
    ViewResource:
      type: object
      additionalProperties: false
      required: [type, database, view]
      properties:
        type:
          const: VIEW
        database:
          type: string
          minLength: 1
        view:
          type: string
          minLength: 1
    PermissionAssignment:
      type: object
      additionalProperties: false
      required: [resource, scope, access, principal]
      properties:
        resource:
          $ref: '#/components/schemas/PermissionResource'
        scope:
          $ref: '#/components/schemas/PermissionScope'
        access:
          $ref: '#/components/schemas/PermissionAccess'
        principal:
          $ref: '#/components/schemas/Principal'
        expireTime:
          type: string
          format: date-time
          description: |
            Exclusive authorization upper bound evaluated using the server clock. At
            `now >= expireTime` this assignment must not authorize access, including through an
            inherited effective view. A direct expired record may remain listable until cleanup.
            The value must have at most millisecond precision.
        inheritedFrom:
          $ref: '#/components/schemas/PermissionResource'
    GrantPermissionRequest:
      type: object
      additionalProperties: false
      required: [resource, access, principal]
      properties:
        resource:
          $ref: '#/components/schemas/PermissionResource'
        scope:
          $ref: '#/components/schemas/PermissionScope'
          default: SELF
        access:
          $ref: '#/components/schemas/PermissionAccess'
        principal:
          $ref: '#/components/schemas/Principal'
        expireTime:
          type: string
          format: date-time
          description: |
            Exclusive authorization upper bound evaluated using the server clock. At
            `now >= expireTime` the assignment must not authorize access. The value must have at
            most millisecond precision.
    RevokePermissionRequest:
      type: object
      additionalProperties: false
      required: [resource, access, principal]
      properties:
        resource:
          $ref: '#/components/schemas/PermissionResource'
        scope:
          $ref: '#/components/schemas/PermissionScope'
          default: SELF
        access:
          $ref: '#/components/schemas/PermissionAccess'
        principal:
          $ref: '#/components/schemas/Principal'
    ListPermissionsResponse:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionAssignment'
        nextPageToken:
          type: string

    ColumnPolicyArgument:
      type: object
      additionalProperties: false
      required: [column]
      properties:
        column:
          type: string
          minLength: 1
    ConstantPolicyArgument:
      type: object
      additionalProperties: false
      required: [constant]
      properties:
        constant:
          type: string
          description: Literal string argument. The empty string is valid.
    PolicyArgument:
      oneOf:
        - $ref: '#/components/schemas/ColumnPolicyArgument'
        - $ref: '#/components/schemas/ConstantPolicyArgument'
    RowFilter:
      type: object
      additionalProperties: false
      required: [functionName]
      properties:
        functionName:
          type: string
          minLength: 1
        functionArguments:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/PolicyArgument'
    ColumnMask:
      type: object
      additionalProperties: false
      required: [functionName, onColumn]
      properties:
        functionName:
          type: string
          minLength: 1
        onColumn:
          type: string
          minLength: 1
        functionArguments:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/PolicyArgument'
    RowFilterPolicyRequest:
      type: object
      additionalProperties: false
      required: [rowFilter, principal]
      properties:
        rowFilter:
          $ref: '#/components/schemas/RowFilter'
        principal:
          $ref: '#/components/schemas/Principal'
    ColumnMaskPolicyRequest:
      type: object
      additionalProperties: false
      required: [columnMask, principal]
      properties:
        columnMask:
          $ref: '#/components/schemas/ColumnMask'
        principal:
          $ref: '#/components/schemas/Principal'
    PolicyRequest:
      description: Exactly one typed policy definition for one principal is allowed.
      oneOf:
        - $ref: '#/components/schemas/RowFilterPolicyRequest'
        - $ref: '#/components/schemas/ColumnMaskPolicyRequest'
    RowFilterPolicyIdentity:
      type: object
      additionalProperties: false
      required: [type, principal]
      properties:
        type:
          const: ROW_FILTER
        principal:
          $ref: '#/components/schemas/Principal'
    ColumnMaskPolicyIdentity:
      type: object
      additionalProperties: false
      required: [type, principal, column]
      properties:
        type:
          const: COLUMN_MASKING
        principal:
          $ref: '#/components/schemas/Principal'
        column:
          type: string
          minLength: 1
    DropPolicyRequest:
      description: Exact principal policy identity on the table named by the request path.
      oneOf:
        - $ref: '#/components/schemas/RowFilterPolicyIdentity'
        - $ref: '#/components/schemas/ColumnMaskPolicyIdentity'
    TablePolicyResource:
      type: object
      additionalProperties: false
      required: [type, database, table]
      properties:
        type:
          const: TABLE
        database:
          type: string
          minLength: 1
        table:
          type: string
          minLength: 1
    RowFilterDataPolicy:
      type: object
      additionalProperties: false
      required: [resource, rowFilter, principal]
      properties:
        resource:
          $ref: '#/components/schemas/TablePolicyResource'
        rowFilter:
          $ref: '#/components/schemas/RowFilter'
        principal:
          $ref: '#/components/schemas/Principal'
    ColumnMaskDataPolicy:
      type: object
      additionalProperties: false
      required: [resource, columnMask, principal]
      properties:
        resource:
          $ref: '#/components/schemas/TablePolicyResource'
        columnMask:
          $ref: '#/components/schemas/ColumnMask'
        principal:
          $ref: '#/components/schemas/Principal'
    DataPolicy:
      description: |
        A policy applies when its principal is effective for the caller. All applicable row filters
        must be combined with logical AND. More than one applicable column mask for the same column
        must fail closed. An unresolved function, invalid signature, or policy compilation failure
        must also fail closed rather than omit a restriction.
      oneOf:
        - $ref: '#/components/schemas/RowFilterDataPolicy'
        - $ref: '#/components/schemas/ColumnMaskDataPolicy'
    ListPoliciesResponse:
      type: object
      additionalProperties: false
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/DataPolicy'
        nextPageToken:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: true
      required: [message, code]
      properties:
        resourceType:
          type: string
        resourceName:
          type: string
        message:
          type: string
        code:
          type: integer
