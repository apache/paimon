<text x="329.0" y="412" font-size="21" font-weight="700" text-anchor="middle" fill="#2463b4">20</text>
<rect x="412" y="384" width="166" height="43" rx="0" fill="#fff2d7" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="495.0" y="412" font-size="21" font-weight="700" text-anchor="middle" fill="#9a5200">22</text>
<rect x="578" y="384" width="166" height="43" rx="0" fill="#e5f5ef" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="661.0" y="412" font-size="21" font-weight="700" text-anchor="middle" fill="#10705d">200</text>
<rect x="136" y="427" width="110" height="43" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="191.0" y="455" font-size="21" font-weight="400" text-anchor="middle" fill="#526277">2</text>
<rect x="246" y="427" width="166" height="43" rx="0" fill="#eaf2ff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="329.0" y="455" font-size="21" font-weight="700" text-anchor="middle" fill="#2463b4">30</text>
<rect x="412" y="427" width="166" height="43" rx="0" fill="#fff2d7" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="495.0" y="455" font-size="21" font-weight="700" text-anchor="middle" fill="#9a5200">3</text>
