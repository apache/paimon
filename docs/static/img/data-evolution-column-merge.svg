<rect x="28" y="496" width="844" height="45" rx="8" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="1.5"/>
<text x="44" y="523" font-size="18" font-weight="400" text-anchor="start" fill="#2463b4">Merge by row position: N2 does not replace b, because N2 contains only c.</text>
</g>
