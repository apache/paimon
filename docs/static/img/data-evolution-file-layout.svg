<rect x="28" y="529" width="844" height="45" rx="8" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="1.5"/>
<text x="44" y="556" font-size="18" font-weight="400" text-anchor="start" fill="#2463b4">Normal versions share the full range. Dedicated files may have smaller boundaries.</text>
