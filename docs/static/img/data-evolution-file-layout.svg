<text x="28" y="43" font-size="27" font-weight="700" text-anchor="start" fill="#172b4d">One logical range, several column files</text>
<text x="28" y="75" font-size="18" font-weight="400" text-anchor="start" fill="#526277">All ranges are inclusive. Each bar represents one physical file.</text>
