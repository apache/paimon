<title id="title">One logical range, several column files</title>
<desc id="desc">Two adjacent file groups. Group A has two normal files over row IDs 0 to 5, BLOB files over 0 to 1 and 2 to 5, and vector files over 0 to 2 and 3 to 5. Group B covers row IDs 6 to 9. Every dedicated file stays inside one normal range.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
