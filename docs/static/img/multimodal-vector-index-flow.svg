<title id="title">From embeddings to matching rows</title>
<desc id="desc">In a Data Evolution append table, a range-sharded index maps embeddings to row IDs. Approximate nearest neighbor search finds top-K row IDs and scores. Paimon uses the row IDs to read the requested table columns.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#526277"/>
  </marker>
</defs>
<rect x="1" y="1" width="778" height="372" rx="12" fill="#fff" stroke="#d7dfeb" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">
  <text x="24" y="45" font-size="28" font-weight="700">From embeddings to matching rows</text>
  <text x="24" y="75" font-size="19" fill="#526277">Data Evolution append table with range sharding</text>

  <text x="24" y="112" font-size="20" font-weight="700">Build</text>
  <rect x="24" y="125" width="320" height="90" rx="8" fill="#eaf2ff" stroke="#d7dfeb"/>
  <rect x="436" y="125" width="320" height="90" rx="8" fill="#f2ecfb" stroke="#d7dfeb"/>
  <g font-size="22" font-weight="700">
    <text x="44" y="160" fill="#2463b4">Embedding column</text>
    <text x="456" y="160" fill="#7046a4">Vector index shards</text>
  </g>
  <g font-size="19" fill="#526277">
    <text x="44" y="189">Embeddings with row IDs</text>
    <text x="456" y="189">Shards cover row-ID ranges</text>
  </g>

  <text x="24" y="252" font-size="20" font-weight="700">Search</text>
  <rect x="24" y="270" width="162" height="78" rx="8" fill="#f5f7fb" stroke="#d7dfeb"/>
  <rect x="210" y="270" width="162" height="78" rx="8" fill="#f2ecfb" stroke="#d7dfeb"/>
  <rect x="402" y="270" width="162" height="78" rx="8" fill="#eaf2ff" stroke="#d7dfeb"/>
  <rect x="594" y="270" width="162" height="78" rx="8" fill="#e7f5f1" stroke="#d7dfeb"/>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <text x="105" y="316">Query vector</text>
    <text x="291" y="304" fill="#7046a4">ANN search</text>
    <text x="483" y="304" fill="#2463b4">Top-K matches</text>
    <text x="675" y="304" fill="#14766b">Read rows</text>
  </g>
  <g font-size="17" fill="#526277" text-anchor="middle">
    <text x="291" y="329">Probe index shards</text>
    <text x="483" y="329">Scored row IDs</text>
    <text x="675" y="329">Projected columns</text>
  </g>
</g>
<g fill="none" stroke="#526277" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
  <path d="M352 170 H426"/>
  <path d="M596 222 V239 H291 V262"/>
  <path d="M191 309 H205"/>
  <path d="M378 309 H396"/>
  <path d="M570 309 H588"/>
</g>
</svg>
