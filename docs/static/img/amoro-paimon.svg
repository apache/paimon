<title id="title">Inspect Paimon tables with Amoro</title>
<desc id="desc">Register a Paimon catalog with Amoro Management Service to inspect schemas, options, files, snapshots, DDL, and compaction information. Terminal SQL runs in Spark, locally inside AMS or through Kyuubi, with access to the same catalog and storage.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">
<rect x="1" y="1" width="958" height="516" rx="12" fill="#fff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="28" y="44" font-size="27" fill="#526277" font-weight="700">Inspect Paimon tables with Amoro</text>
<text x="28" y="77" font-size="18" fill="#526277">Catalog registration makes existing table metadata available in AMS.</text>
<rect x="28" y="124" width="258" height="166" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="46" y="157" font-size="21" fill="#10705d" font-weight="700">Paimon catalog</text>
<text x="46" y="189" font-size="18" fill="#526277">Catalog configuration</text>
<text x="46" y="215" font-size="18" fill="#526277">Metastore / service access</text>
<text x="46" y="241" font-size="18" fill="#526277">Warehouse storage</text>
<rect x="370" y="124" width="242" height="166" rx="8" fill="#f1ebfa" stroke="#7051a3" stroke-width="1.5"/>
<text x="388" y="157" font-size="21" fill="#7051a3" font-weight="700">AMS</text>
<text x="388" y="189" font-size="18" fill="#526277">Registered catalog</text>
<text x="388" y="215" font-size="18" fill="#526277">Paimon integration</text>
<text x="388" y="241" font-size="18" fill="#526277">Storage dependencies</text>
<rect x="696" y="124" width="236" height="166" rx="8" fill="#f1ebfa" stroke="#7051a3" stroke-width="1.5"/>
<text x="714" y="157" font-size="21" fill="#7051a3" font-weight="700">Table views</text>
<text x="714" y="189" font-size="18" fill="#526277">Schema · options · DDL</text>
<text x="714" y="215" font-size="18" fill="#526277">Files · snapshots</text>
<text x="714" y="241" font-size="18" fill="#526277">Compaction information</text>
<path d="M 290 206 H 366" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<text x="306" y="190" font-size="16" fill="#526277">register</text>
<path d="M 616 206 H 692" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="190" font-size="16" fill="#526277">browse</text>
<path d="M 28 327 H 932" stroke="#d7dfeb" stroke-width="1.5"/>
<rect x="28" y="360" width="258" height="112" rx="8" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="46" y="393" font-size="21" fill="#2463b4" font-weight="700">Amoro Terminal</text>
<text x="46" y="425" font-size="18" fill="#526277">Submit Spark SQL</text>
<rect x="370" y="360" width="242" height="112" rx="8" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="388" y="393" font-size="21" fill="#2463b4" font-weight="700">Spark runtime</text>
<text x="388" y="425" font-size="18" fill="#526277">Local in AMS / Kyuubi</text>
<rect x="696" y="360" width="236" height="112" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="714" y="393" font-size="21" fill="#10705d" font-weight="700">Paimon tables</text>
<text x="714" y="425" font-size="18" fill="#526277">Shared catalog + files</text>
<path d="M 290 416 H 366" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<text x="304" y="399" font-size="16" fill="#526277">submit</text>
<path d="M 616 416 H 692" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<text x="631" y="399" font-size="16" fill="#526277">access</text>
<text x="28" y="500" font-size="18" fill="#526277">Verify the Terminal backend, connector, and storage access.</text>
</g>
</svg>
