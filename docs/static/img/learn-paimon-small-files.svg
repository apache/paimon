<title id="title">Why a large stream can produce small files</title>
<desc id="desc">The same illustrative 80 megabytes of input per checkpoint spreads into 40 megabytes for each of two active partition-bucket destinations, or 10 megabytes for each of eight active destinations. More destinations or shorter intervals reduce data per destination. This is input volume before compression, merging, or extra flushes, not a prediction of output file size.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
<rect width="1080" height="656" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="48" font-size="28" font-weight="700" text-anchor="start" fill="#172b4d">Why a large stream can produce small files</text>
<text x="32" y="80" font-size="18" font-weight="400" text-anchor="start" fill="#526277">Illustrative input volume per checkpoint, before compression, merging, or extra flushes.</text>
<rect x="314" y="112" width="452" height="82" rx="10" fill="#edf4ff" stroke="#2166b1" stroke-width="1.5"/>
<text x="332" y="144" font-size="21" font-weight="700" text-anchor="start" fill="#2166b1">80 MB arriving in one checkpoint</text>
<path d="M 540 194 V 224 H 278 V 274" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 540 224 H 802 V 274" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="274" width="492" height="268" rx="10" fill="#eaf7f2" stroke="#10705d" stroke-width="1.5"/>
<text x="50" y="306" font-size="21" font-weight="700" text-anchor="start" fill="#10705d">2 active partition / bucket destinations</text>
<rect x="556" y="274" width="492" height="268" rx="10" fill="#edf4ff" stroke="#2166b1" stroke-width="1.5"/>
<text x="574" y="306" font-size="21" font-weight="700" text-anchor="start" fill="#2166b1">8 active partition / bucket destinations</text>
<rect x="66" y="346" width="202" height="124" rx="10" fill="#eaf7f2" stroke="#10705d" stroke-width="1.5"/>
<text x="84" y="378" font-size="21" font-weight="700" text-anchor="start" fill="#10705d">40 MB</text>
<text x="84" y="408" font-size="18" font-weight="400" text-anchor="start" fill="#526277">per destination</text>
<rect x="290" y="346" width="202" height="124" rx="10" fill="#eaf7f2" stroke="#10705d" stroke-width="1.5"/>
<text x="308" y="378" font-size="21" font-weight="700" text-anchor="start" fill="#10705d">40 MB</text>
<text x="308" y="408" font-size="18" font-weight="400" text-anchor="start" fill="#526277">per destination</text>
<rect x="580" y="340" width="102" height="66" rx="8" fill="#ffffff" stroke="#2166b1" stroke-width="1.5"/>
<text x="631" y="380" font-size="19" font-weight="700" text-anchor="middle" fill="#2166b1">10 MB</text>
<rect x="696" y="340" width="102" height="66" rx="8" fill="#ffffff" stroke="#2166b1" stroke-width="1.5"/>
<text x="747" y="380" font-size="19" font-weight="700" text-anchor="middle" fill="#2166b1">10 MB</text>
<rect x="812" y="340" width="102" height="66" rx="8" fill="#ffffff" stroke="#2166b1" stroke-width="1.5"/>
<text x="863" y="380" font-size="19" font-weight="700" text-anchor="middle" fill="#2166b1">10 MB</text>
<rect x="928" y="340" width="102" height="66" rx="8" fill="#ffffff" stroke="#2166b1" stroke-width="1.5"/>
<text x="979" y="380" font-size="19" font-weight="700" text-anchor="middle" fill="#2166b1">10 MB</text>
<rect x="580" y="428" width="102" height="66" rx="8" fill="#ffffff" stroke="#2166b1" stroke-width="1.5"/>
<text x="631" y="468" font-size="19" font-weight="700" text-anchor="middle" fill="#2166b1">10 MB</text>
<rect x="696" y="428" width="102" height="66" rx="8" fill="#ffffff" stroke="#2166b1" stroke-width="1.5"/>
<text x="747" y="468" font-size="19" font-weight="700" text-anchor="middle" fill="#2166b1">10 MB</text>
<rect x="812" y="428" width="102" height="66" rx="8" fill="#ffffff" stroke="#2166b1" stroke-width="1.5"/>
<text x="863" y="468" font-size="19" font-weight="700" text-anchor="middle" fill="#2166b1">10 MB</text>
<rect x="928" y="428" width="102" height="66" rx="8" fill="#ffffff" stroke="#2166b1" stroke-width="1.5"/>
<text x="979" y="468" font-size="19" font-weight="700" text-anchor="middle" fill="#2166b1">10 MB</text>
<text x="578" y="526" font-size="18" font-weight="400" text-anchor="start" fill="#526277">More destinations → less data in each</text>
<text x="32" y="589" font-size="21" font-weight="700" text-anchor="start" fill="#172b4d">Other causes to check</text>
<text x="32" y="622" font-size="18" font-weight="400" text-anchor="start" fill="#526277">Short intervals · buffer pressure · skew · compaction backlog · retained history</text>
</g>
</svg>
