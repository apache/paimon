<title id="title">One table, several integrations</title>
<desc id="desc">Flink and Spark read and write Paimon tables. StarRocks, Doris, Hive, Trino, and Presto query the same tables. Amoro connects to the catalog to inspect table metadata.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">
<rect x="1" y="1" width="958" height="488" rx="12" fill="#fff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="28" y="44" font-size="27" fill="#526277" font-weight="700">One table, several integrations</text>
<text x="28" y="77" font-size="18" fill="#526277">Choose an integration for ingestion, SQL queries, or table management.</text>
<rect x="28" y="148" width="236" height="150" rx="8" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="46" y="181" font-size="21" fill="#2463b4" font-weight="700">Write and transform</text>
<text x="46" y="213" font-size="18" fill="#526277">Flink</text>
<text x="46" y="239" font-size="18" fill="#526277">Spark</text>
<text x="46" y="265" font-size="18" fill="#526277">Batch and streaming</text>
<rect x="350" y="148" width="260" height="150" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="368" y="181" font-size="21" fill="#10705d" font-weight="700">Paimon tables</text>
<text x="368" y="213" font-size="18" fill="#526277">Schemas and snapshots</text>
<text x="368" y="239" font-size="18" fill="#526277">Data and changelog files</text>
<text x="368" y="265" font-size="18" fill="#526277">Shared storage</text>
<rect x="696" y="122" width="236" height="202" rx="8" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="714" y="155" font-size="21" fill="#2463b4" font-weight="700">Query</text>
<text x="714" y="187" font-size="18" fill="#526277">StarRocks · Doris</text>
<text x="714" y="213" font-size="18" fill="#526277">Hive · Trino · Presto</text>
<text x="714" y="239" font-size="18" fill="#526277">Flink · Spark</text>
<text x="714" y="265" font-size="18" fill="#526277">Engine-specific readers</text>
<path d="M 268 224 H 346" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="274" y="207" font-size="14" fill="#526277">read / write</text>
<path d="M 614 224 H 692" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<text x="633" y="207" font-size="16" fill="#526277">read</text>
<path d="M 480 302 V 388" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="496" y="351" font-size="16" fill="#526277">inspect metadata</text>
<rect x="28" y="392" width="904" height="76" rx="8" fill="#f1ebfa" stroke="#7051a3" stroke-width="1.5"/>
<text x="46" y="425" font-size="21" fill="#7051a3" font-weight="700">Amoro · Table management</text>
<text x="46" y="448" font-size="18" fill="#526277">Register the catalog; browse schemas, files, snapshots, and table options.</text>
<text x="28" y="357" font-size="16" fill="#526277">Operations and table features vary by connector version.</text>
</g>
</svg>
