  <title id="title">Clone replaces the copied partitions</title>
  <desc id="desc">With dynamic-partition-overwrite enabled, copying Hive partition dt=2026-09-10 replaces old rows in that target partition and retains dt=2026-09-09. The source table and files stay available. The diagram assumes data is copied for the selected partition.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="1" y="1" width="898" height="488" rx="12" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
    <text x="28" y="43" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">Clone replaces the copied partitions</text>
    <text x="28" y="77" font-size="18" fill="#526277" font-weight="400" text-anchor="start">Example: copy dt = 2026-09-10 with dynamic-partition-overwrite = true</text>
    <rect x="28" y="104" width="844" height="79" rx="8" fill="#eaf2ff" stroke="#bfd2ed" stroke-width="1.5"/>
    <text x="48" y="135" font-size="21" fill="#2463b4" font-weight="700" text-anchor="start">Hive source</text>
    <text x="48" y="164" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">dt=2026-09-10 → new rows</text>
    <text x="848" y="150" font-size="19" fill="#2463b4" font-weight="400" text-anchor="end">Source table and files stay available</text>
    <text x="28" y="228" font-size="16" fill="#526277" font-weight="700" text-anchor="start">TARGET BEFORE</text>
    <text x="539" y="228" font-size="16" fill="#526277" font-weight="700" text-anchor="start">TARGET AFTER</text>
    <rect x="28" y="246" width="333" height="143" rx="8" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
    <rect x="539" y="246" width="333" height="143" rx="8" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
    <rect x="44" y="262" width="301" height="47" rx="8" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
    <text x="60" y="292" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">09-09  |  retained rows</text>
    <rect x="44" y="326" width="301" height="47" rx="8" fill="#fff7e6" stroke="#e4cb92" stroke-width="1.5"/>
    <text x="60" y="356" font-size="20" fill="#946200" font-weight="400" text-anchor="start">09-10  |  old rows</text>
    <rect x="555" y="262" width="301" height="47" rx="8" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
    <text x="571" y="292" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">09-09  |  retained rows</text>
    <rect x="555" y="326" width="301" height="47" rx="8" fill="#e8f7f2" stroke="#b8dcd2" stroke-width="1.5"/>
    <text x="571" y="356" font-size="20" fill="#087f6e" font-weight="700" text-anchor="start">09-10  |  new rows</text>
    <text x="450" y="303" font-size="20" fill="#2463b4" font-weight="700" text-anchor="middle">Clone</text>
    <path d="M 375 324 H 525" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="28" y="426" font-size="18" fill="#526277" font-weight="400" text-anchor="start">Re-run: refresh the copied partition. Partitions absent from the copy remain unchanged.</text>
    <text x="28" y="460" font-size="18" fill="#946200" font-weight="400" text-anchor="start">Check existing target options: disabling dynamic overwrite can replace the whole table.</text>
  </g>
</svg>
