<title id="title">Choose where metadata lives</title>
<desc id="desc">With catalog-location, Iceberg metadata is under warehouse/iceberg/default/cities/metadata. With table-location, metadata is under warehouse/default.db/cities/metadata. Both layouts reference Paimon data files in the original table.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="958" height="532" rx="12" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="28" y="43" font-size="27" font-weight="700" text-anchor="start" fill="#172b4d">Choose where metadata lives</text>
<text x="28" y="75" font-size="18" font-weight="400" text-anchor="start" fill="#526277">Example table: &lt;warehouse&gt;/default.db/cities</text>
<rect x="28" y="103" width="440" height="360" rx="10" fill="#f8fafc" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="48" y="139" font-size="23" font-weight="700" text-anchor="start" fill="#2463b4">catalog-location</text>
<text x="48" y="167" font-size="17" font-weight="400" text-anchor="start" fill="#526277">Default for Hadoop, Hive, and REST</text>
<text x="48" y="210" font-size="18" font-weight="700" text-anchor="start" fill="#172b4d" font-family="monospace">&lt;warehouse&gt;/</text>
<rect x="492" y="103" width="440" height="360" rx="10" fill="#f8fafc" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="512" y="139" font-size="23" font-weight="700" text-anchor="start" fill="#2463b4">table-location</text>
<text x="512" y="167" font-size="17" font-weight="400" text-anchor="start" fill="#526277">Store metadata alongside the table</text>
<text x="512" y="210" font-size="18" font-weight="700" text-anchor="start" fill="#172b4d" font-family="monospace">&lt;warehouse&gt;/</text>
<text x="66" y="248" font-size="18" font-weight="400" text-anchor="start" fill="#172b4d" font-family="monospace">default.db/cities/</text>
<rect x="82" y="264" width="340" height="49" rx="7" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="100" y="295" font-size="18" font-weight="700" text-anchor="start" fill="#10705d">Paimon data files</text>
<text x="66" y="355" font-size="18" font-weight="400" text-anchor="start" fill="#172b4d" font-family="monospace">iceberg/default/cities/</text>
<rect x="82" y="371" width="340" height="49" rx="7" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="100" y="402" font-size="18" font-weight="700" text-anchor="start" fill="#2463b4" font-family="monospace">metadata/</text>
<text x="530" y="248" font-size="18" font-weight="400" text-anchor="start" fill="#172b4d" font-family="monospace">default.db/cities/</text>
<rect x="546" y="264" width="340" height="49" rx="7" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="564" y="295" font-size="18" font-weight="700" text-anchor="start" fill="#10705d">Paimon data files</text>
<rect x="546" y="371" width="340" height="49" rx="7" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="564" y="402" font-size="18" font-weight="700" text-anchor="start" fill="#2463b4" font-family="monospace">metadata/</text>
<path d="M 422 395 H 448 V 289 H 428" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="248" y="446" font-size="16" font-weight="400" text-anchor="middle" fill="#526277">Metadata references the original data files</text>
<path d="M 886 395 H 912 V 289 H 892" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="712" y="446" font-size="16" font-weight="400" text-anchor="middle" fill="#526277">Metadata references the original data files</text>
<text x="480" y="503" font-size="18" font-weight="400" text-anchor="middle" fill="#526277">Catalog selection controls discovery. The layout option controls metadata paths.</text>
</g>
</svg>
