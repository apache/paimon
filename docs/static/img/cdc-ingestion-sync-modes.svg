<title id="title">Choose where source tables land</title>
<desc id="desc">Table synchronization merges two selected source tables into one target. Database synchronization routes orders and customers to separate target tables.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">
<rect x="1" y="1" width="958" height="592" rx="12" fill="#fff" stroke="#d7dfeb"/>
<text x="28" y="44" font-size="27" fill="#172b4d" font-weight="700">Choose where source tables land</text>
<text x="28" y="76" font-size="18" fill="#526277" font-weight="400">Table synchronization chooses one target; database synchronization keeps separate targets.</text>
<text x="28" y="122" font-size="17" fill="#2463b4" font-weight="700">TABLE SYNCHRONIZATION</text>
<rect x="28" y="141" width="226" height="70" rx="8" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="44" y="172" font-size="21" fill="#2463b4" font-weight="700">shard_1.orders</text>
<rect x="28" y="229" width="226" height="70" rx="8" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="44" y="260" font-size="21" fill="#2463b4" font-weight="700">shard_2.orders</text>
<path d="M 257 176 H 284 V 219 H 320" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 257 264 H 284 V 219 H 320" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="323" y="167" width="276" height="106" rx="8" fill="#f1ebfa" stroke="#7051a3" stroke-width="1.5"/>
<text x="339" y="198" font-size="21" fill="#7051a3" font-weight="700">Table action</text>
<text x="339" y="227" font-size="18" fill="#526277" font-weight="400">Merge compatible schemas</text>
<text x="339" y="252" font-size="18" fill="#526277" font-weight="400">Use one target key space</text>
<path d="M 602 219 H 664" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="667" y="167" width="265" height="106" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="683" y="198" font-size="21" fill="#10705d" font-weight="700">analytics.orders</text>
<text x="683" y="227" font-size="18" fill="#526277" font-weight="400">One Paimon table</text>
<text x="683" y="252" font-size="18" fill="#526277" font-weight="400">Keys identify merged rows</text>
<path d="M 28 325 H 932" stroke="#d7dfeb"/>
<text x="28" y="363" font-size="17" fill="#2463b4" font-weight="700">DATABASE SYNCHRONIZATION</text>
<rect x="28" y="382" width="226" height="70" rx="8" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="44" y="413" font-size="21" fill="#2463b4" font-weight="700">shop.orders</text>
<rect x="28" y="470" width="226" height="70" rx="8" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="44" y="501" font-size="21" fill="#2463b4" font-weight="700">shop.customers</text>
<path d="M 257 417 H 320" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 257 505 H 320" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="323" y="392" width="276" height="139" rx="8" fill="#f1ebfa" stroke="#7051a3" stroke-width="1.5"/>
<text x="339" y="423" font-size="21" fill="#7051a3" font-weight="700">Database action</text>
<text x="339" y="452" font-size="18" fill="#526277" font-weight="400">Select source tables</text>
<text x="339" y="477" font-size="18" fill="#526277" font-weight="400">Apply target naming rules</text>
<text x="339" y="502" font-size="18" fill="#526277" font-weight="400">Route each table</text>
<path d="M 602 417 H 664" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 602 505 H 664" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="667" y="382" width="265" height="70" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="683" y="413" font-size="21" fill="#10705d" font-weight="700">analytics.orders</text>
<rect x="667" y="470" width="265" height="70" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="683" y="501" font-size="21" fill="#10705d" font-weight="700">analytics.customers</text>
<text x="28" y="570" font-size="17" fill="#526277" font-weight="400">MySQL database synchronization can also merge same-name shards when configured.</text>
</g>
</svg>
