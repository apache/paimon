<title id="title">Choose row semantics before storage options</title>
<desc id="desc">Incoming rows either merge by primary key or remain independent append rows. Primary-key designs then choose distribution, read mode, and changelog; append designs choose unaware buckets, fixed buckets, or Data Evolution for column updates and managed payloads.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
<rect width="1080" height="680" rx="16" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="48" font-size="28" font-weight="700" text-anchor="start" fill="#172b4d">Choose row semantics before storage options</text>
<text x="32" y="80" font-size="18" font-weight="400" text-anchor="start" fill="#526277">Start with the meaning of an input record, then check each feature’s requirements.</text>
<rect x="230" y="112" width="620" height="78" rx="10" fill="#edf4ff" stroke="#2166b1" stroke-width="1.5"/>
<text x="248" y="144" font-size="21" font-weight="700" text-anchor="start" fill="#2166b1">Should incoming records merge by a declared key?</text>
<path d="M 540 190 V 214 H 278 V 256" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 540 214 H 802 V 256" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<text x="292" y="242" font-size="18" font-weight="700" text-anchor="start" fill="#2166b1">Yes</text>
<text x="816" y="242" font-size="18" font-weight="700" text-anchor="start" fill="#10705d">No</text>
<rect x="32" y="256" width="492" height="124" rx="10" fill="#edf4ff" stroke="#2166b1" stroke-width="1.5"/>
<text x="50" y="288" font-size="21" font-weight="700" text-anchor="start" fill="#2166b1">Primary-key table</text>
<text x="50" y="318" font-size="19" font-weight="400" text-anchor="start" fill="#526277">Keep latest · combine columns · aggregate</text>
<text x="50" y="345" font-size="19" font-weight="400" text-anchor="start" fill="#526277">Or keep the first row received for a key</text>
<rect x="556" y="256" width="492" height="124" rx="10" fill="#eaf7f2" stroke="#10705d" stroke-width="1.5"/>
<text x="574" y="288" font-size="21" font-weight="700" text-anchor="start" fill="#10705d">Append table</text>
<text x="574" y="318" font-size="19" font-weight="400" text-anchor="start" fill="#526277">Store rows independently</text>
<text x="574" y="345" font-size="19" font-weight="400" text-anchor="start" fill="#526277">Batch SQL can still update or delete rows</text>
<path d="M 278 380 V 426" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 802 380 V 426" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="426" width="492" height="178" rx="10" fill="#edf4ff" stroke="#2166b1" stroke-width="1.5"/>
<text x="50" y="458" font-size="21" font-weight="700" text-anchor="start" fill="#2166b1">Make three separate choices</text>
<text x="50" y="488" font-size="19" font-weight="400" text-anchor="start" fill="#526277">Distribution: dynamic / fixed / postpone</text>
<text x="50" y="515" font-size="19" font-weight="400" text-anchor="start" fill="#526277">Read behavior: MOR / COW / MOW</text>
<text x="50" y="542" font-size="19" font-weight="400" text-anchor="start" fill="#526277">Streaming output: changelog producer</text>
<rect x="556" y="426" width="492" height="178" rx="10" fill="#eaf7f2" stroke="#10705d" stroke-width="1.5"/>
<text x="574" y="458" font-size="21" font-weight="700" text-anchor="start" fill="#10705d">Choose a layout for the workload</text>
<text x="574" y="488" font-size="19" font-weight="400" text-anchor="start" fill="#526277">Unaware buckets: batch and general append</text>
<text x="574" y="515" font-size="19" font-weight="400" text-anchor="start" fill="#526277">Fixed buckets: pruning / joins / append order</text>
<text x="574" y="542" font-size="19" font-weight="400" text-anchor="start" fill="#526277">Data Evolution: column updates and BLOBs</text>
<text x="32" y="646" font-size="18" font-weight="400" text-anchor="start" fill="#526277">Indexes are an additional choice. An embedding column does not automatically have a search index.</text>
</g>
</svg>
