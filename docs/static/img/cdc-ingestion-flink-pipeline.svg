<title id="title">Read from Paimon with Flink CDC</title>
<desc id="desc">A Paimon catalog and its tables feed a Flink CDC YAML pipeline, which sends row and schema events to an external sink such as Doris.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">
<rect x="1" y="1" width="958" height="304" rx="12" fill="#fff" stroke="#d7dfeb"/>
<text x="28" y="44" font-size="27" fill="#172b4d" font-weight="700">Read from Paimon with Flink CDC</text>
<text x="28" y="76" font-size="18" fill="#526277" font-weight="400">This connector reads Paimon tables and sends changes to another system.</text>
<rect x="28" y="118" width="250" height="112" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="44" y="149" font-size="21" fill="#10705d" font-weight="700">Paimon source</text>
<text x="44" y="178" font-size="18" fill="#526277" font-weight="400">Catalog + warehouse</text>
<text x="44" y="203" font-size="18" fill="#526277" font-weight="400">Selected tables</text>
<path d="M 281 174 H 330" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="333" y="118" width="270" height="112" rx="8" fill="#f1ebfa" stroke="#7051a3" stroke-width="1.5"/>
<text x="349" y="149" font-size="21" fill="#7051a3" font-weight="700">Flink CDC pipeline</text>
<text x="349" y="178" font-size="18" fill="#526277" font-weight="400">Row events</text>
<text x="349" y="203" font-size="18" fill="#526277" font-weight="400">Schema-change events</text>
<path d="M 606 174 H 664" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="667" y="118" width="265" height="112" rx="8" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="683" y="149" font-size="21" fill="#2463b4" font-weight="700">External sink</text>
<text x="683" y="178" font-size="18" fill="#526277" font-weight="400">For example, Doris</text>
<text x="683" y="203" font-size="18" fill="#526277" font-weight="400">Receives table changes</text>
<text x="28" y="272" font-size="18" fill="#526277" font-weight="400">To ingest into Paimon, configure a Paimon sink or use a Paimon CDC action.</text>
</g>
</svg>
