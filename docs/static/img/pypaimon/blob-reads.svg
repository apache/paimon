<title id="title">Read only the BLOB payload you need</title>
<desc id="desc">With blob-as-descriptor enabled, a scan returns lightweight BLOB descriptors. A descriptor identifies a URI and byte range. Resolve it through FileIO when the application needs the payload; partial reads can fetch a smaller range.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L9 4L0 8Z" fill="#63788e"/>
</marker>
</defs>
<rect width="960" height="540" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="32" y="43" font-size="25" fill="#142c40" font-weight="650" text-anchor="start">Read only the BLOB payload you need</text>
<text x="32" y="77" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Descriptor mode: blob-as-descriptor = true</text>
<rect x="32" y="110" width="270" height="139" rx="12" fill="#eef6f8" stroke="#b7d8de" stroke-width="1.5"/>
<text x="52" y="143" font-size="21" fill="#153d49" font-weight="600" text-anchor="start">1  Scan rows</text>
<text x="52" y="173" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Filter and project</text>
<text x="52" y="198" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Keep lightweight</text>
<text x="52" y="223" font-size="18" fill="#526176" font-weight="400" text-anchor="start">BLOB references</text>
<rect x="346" y="110" width="270" height="139" rx="12" fill="#f3f0fb" stroke="#d7cdec" stroke-width="1.5"/>
<text x="366" y="143" font-size="21" fill="#4a3674" font-weight="600" text-anchor="start">2  Open a stream</text>
<text x="366" y="173" font-size="18" fill="#526176" font-weight="400" text-anchor="start">URI + offset + length</text>
<text x="366" y="198" font-size="18" fill="#526176" font-weight="400" text-anchor="start">new_input_stream()</text>
<text x="366" y="223" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Read when needed</text>
<rect x="660" y="110" width="268" height="139" rx="12" fill="#eef6f8" stroke="#b7d8de" stroke-width="1.5"/>
<text x="680" y="143" font-size="21" fill="#153d49" font-weight="600" text-anchor="start">3  Consume bytes</text>
<text x="680" y="173" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Read a chunk or payload</text>
<text x="680" y="198" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Decode an image</text>
<text x="680" y="223" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Feed the next stage</text>
<path d="M302 177H346" fill="none" stroke="#63788e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M616 177H660" fill="none" stroke="#63788e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M480 249V310" fill="none" stroke="#63788e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="503" y="287" font-size="17" fill="#526176" font-weight="400" text-anchor="start">FileIO range read</text>
<rect x="32" y="311" width="896" height="191" rx="12" fill="#fff7e9" stroke="#e7d0a4" stroke-width="1.5"/>
<text x="52" y="345" font-size="21" fill="#79521b" font-weight="600" text-anchor="start">Managed .blob file</text>
<rect x="52" y="369" width="250" height="55" rx="6" fill="#f1e7d5"/>
<rect x="310" y="369" width="306" height="55" rx="6" fill="#ddeee8" stroke="#328578" stroke-width="2"/>
<rect x="624" y="369" width="284" height="55" rx="6" fill="#f1e7d5"/>
<text x="177" y="403" font-size="18" fill="#526176" font-weight="400" text-anchor="middle">Other payloads</text>
<text x="463" y="403" font-size="18" fill="#215b50" font-weight="600" text-anchor="middle">Requested payload range</text>
<text x="766" y="403" font-size="18" fill="#526176" font-weight="400" text-anchor="middle">Other payloads</text>
<text x="52" y="468" font-size="18" fill="#526176" font-weight="400" text-anchor="start">BLOB bytes stay in storage until they are resolved.</text>
</g>
</svg>
