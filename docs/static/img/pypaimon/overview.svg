<title id="title">One table layer for Python data and AI</title>
<desc id="desc">Python and multimodal APIs and compute integrations share Paimon catalogs, snapshots, and data files. Catalogs locate tables; readers and writers access table files through FileIO.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L9 4L0 8Z" fill="#63788e"/>
</marker>
</defs>
