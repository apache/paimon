<text x="362" y="196" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Search and row operations</text>
<rect x="652" y="108" width="276" height="112" rx="12" fill="#eef6f8" stroke="#b7d8de" stroke-width="1.5"/>
<text x="672" y="141" font-size="21" fill="#153d49" font-weight="600" text-anchor="start">Compute integrations</text>
<text x="672" y="171" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Ray Data · Daft</text>
