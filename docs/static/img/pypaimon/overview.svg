<text x="52" y="329" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Filesystem · JDBC · REST</text>
<text x="52" y="354" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Resolve tables and manage metadata</text>
