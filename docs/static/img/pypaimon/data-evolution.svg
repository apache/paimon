<title id="title">Update columns without rewriting every payload</title>
<desc id="desc">A data-evolution update writes selected columns matched by row ID. Readers of the committed snapshot assemble the updated columns with unchanged columns and BLOB payloads. This is a logical view, not a physical file layout.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0L9 4L0 8Z" fill="#63788e"/>
</marker>
</defs>
<rect width="960" height="552" rx="16" fill="#ffffff"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="32" y="43" font-size="25" fill="#142c40" font-weight="650" text-anchor="start">Update columns without rewriting every payload</text>
<text x="32" y="77" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Logical view of a committed update matched by _ROW_ID</text>
<rect x="32" y="110" width="414" height="132" rx="12" fill="#eef6f8" stroke="#b7d8de" stroke-width="1.5"/>
<text x="52" y="143" font-size="21" fill="#153d49" font-weight="600" text-anchor="start">Existing columns</text>
<text x="52" y="173" font-size="18" fill="#526176" font-weight="400" text-anchor="start">_ROW_ID 42 · category = lake</text>
<text x="52" y="198" font-size="18" fill="#526176" font-weight="400" text-anchor="start">content = Paimon table</text>
<text x="52" y="223" font-size="18" fill="#526176" font-weight="400" text-anchor="start">image = existing BLOB payload</text>
<rect x="514" y="110" width="414" height="132" rx="12" fill="#f3f0fb" stroke="#d7cdec" stroke-width="1.5"/>
<text x="534" y="143" font-size="21" fill="#4a3674" font-weight="600" text-anchor="start">Update input</text>
<text x="534" y="173" font-size="18" fill="#526176" font-weight="400" text-anchor="start">_ROW_ID 42</text>
<text x="534" y="198" font-size="18" fill="#526176" font-weight="400" text-anchor="start">category = docs</text>
<text x="534" y="223" font-size="18" fill="#526176" font-weight="400" text-anchor="start">Write the selected column only</text>
<path d="M239 242V287H398V331" fill="none" stroke="#63788e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M721 242V287H562V331" fill="none" stroke="#63788e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="312" font-size="17" fill="#526176" font-weight="400" text-anchor="start">Reuse unchanged columns</text>
<text x="660" y="312" font-size="17" fill="#526176" font-weight="400" text-anchor="start">Commit the update</text>
<rect x="214" y="332" width="532" height="160" rx="12" fill="#eef7f0" stroke="#b7d9c3" stroke-width="1.5"/>
<text x="234" y="365" font-size="21" fill="#245d3d" font-weight="600" text-anchor="start">Read the committed snapshot</text>
<text x="234" y="395" font-size="18" fill="#526176" font-weight="400" text-anchor="start">_ROW_ID 42 · category = docs</text>
<text x="234" y="420" font-size="18" fill="#526176" font-weight="400" text-anchor="start">content = Paimon table</text>
<text x="234" y="445" font-size="18" fill="#526176" font-weight="400" text-anchor="start">image = existing BLOB payload</text>
<text x="32" y="530" font-size="17" fill="#526176" font-weight="400" text-anchor="start">Requires row-tracking.enabled and data-evolution.enabled.</text>
</g>
</svg>
