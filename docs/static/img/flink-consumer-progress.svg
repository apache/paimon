<title id="title">Retain the history a reader still needs</title>
<desc id="desc">A consumer has recorded snapshot 22 as its next snapshot. Snapshots 20 and 21 have been consumed; needed history from 22 is protected by the active consumer. Earlier snapshots still obey other retention rules. Stop the reader before resetting its progress.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">
<rect x="1" y="1" width="958" height="424" rx="12" fill="#fff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="28" y="44" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">Retain the history a reader still needs</text>
<text x="28" y="77" font-size="18" fill="#526277" font-weight="400" text-anchor="start">Example: the consumer has recorded next snapshot = 22.</text>
<rect x="40" y="133" width="154" height="86" rx="8" fill="#f3f5f8" stroke="#526277" stroke-width="1.5"/>
<text x="117" y="169" font-size="21" fill="#526277" font-weight="700" text-anchor="middle">Snapshot 20</text>
<text x="117" y="198" font-size="17" fill="#526277" font-weight="400" text-anchor="middle">Consumed</text>
<path d="M 196 177 H 217" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="221" y="133" width="154" height="86" rx="8" fill="#f3f5f8" stroke="#526277" stroke-width="1.5"/>
<text x="298" y="169" font-size="21" fill="#526277" font-weight="700" text-anchor="middle">Snapshot 21</text>
<text x="298" y="198" font-size="17" fill="#526277" font-weight="400" text-anchor="middle">Consumed</text>
<path d="M 377 177 H 398" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="402" y="133" width="154" height="86" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="479" y="169" font-size="21" fill="#10705d" font-weight="700" text-anchor="middle">Snapshot 22</text>
<text x="479" y="198" font-size="17" fill="#526277" font-weight="400" text-anchor="middle">Still needed</text>
<path d="M 558 177 H 579" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="583" y="133" width="154" height="86" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="660" y="169" font-size="21" fill="#10705d" font-weight="700" text-anchor="middle">Snapshot 23</text>
<text x="660" y="198" font-size="17" fill="#526277" font-weight="400" text-anchor="middle">Still needed</text>
<path d="M 739 177 H 760" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="764" y="133" width="154" height="86" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="841" y="169" font-size="21" fill="#10705d" font-weight="700" text-anchor="middle">Snapshot 24</text>
<text x="841" y="198" font-size="17" fill="#526277" font-weight="400" text-anchor="middle">Still needed</text>
<text x="40" y="255" font-size="18" fill="#526277" font-weight="400" text-anchor="start">May expire under</text>
<text x="40" y="281" font-size="18" fill="#526277" font-weight="400" text-anchor="start">other retention rules</text>
<rect x="402" y="237" width="516" height="72" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="420" y="267" font-size="21" fill="#10705d" font-weight="700" text-anchor="start">Consumer protects its required history</text>
<text x="420" y="293" font-size="16" fill="#526277" font-weight="400" text-anchor="start">Protection ends when progress advances or the consumer expires.</text>
<path d="M 479 131 V 104" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="113" font-size="18" fill="#10705d" font-weight="700" text-anchor="start">Resume from here</text>
<rect x="28" y="336" width="904" height="64" rx="8" fill="#f8fafc" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="44" y="363" font-size="18" fill="#172b4d" font-weight="700" text-anchor="start">Before reset or deletion: stop the reader and check retained history.</text>
<text x="44" y="389" font-size="18" fill="#526277" font-weight="400" text-anchor="start">Set consumer.expiration-time so abandoned consumers do not retain history indefinitely.</text>
</g>
</svg>
