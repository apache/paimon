<title id="title">Update one row; write one column over the full range</title>
<desc id="desc">An UPDATE sets b to 22 for id 20. The original file N0 contains row IDs 0, 1, and 2. New file N1 contains b values 1, 22, and 3 over the same range. Values 1 and 3 are preserved. N0 remains unchanged and continues to supply id and c.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">
<rect x="1" y="1" width="898" height="488" rx="12" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="28" y="43" font-size="27" font-weight="700" text-anchor="start" fill="#172b4d">Update one row; write one column over the full range</text>
<rect x="28" y="68" width="844" height="43" rx="6" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="44" y="96" font-size="20" font-weight="700" text-anchor="start" fill="#172b4d">UPDATE t SET b = 22 WHERE id = 20</text>
<text x="28" y="150" font-size="21" font-weight="700" text-anchor="start" fill="#2463b4">N0 · existing file [0, 2]</text>
<text x="559" y="150" font-size="21" font-weight="700" text-anchor="start" fill="#9a5200">N1 · new file [0, 2]</text>
<rect x="28" y="170" width="89" height="40" rx="0" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="72.5" y="197" font-size="18" font-weight="700" text-anchor="middle" fill="#526277">Row ID</text>
<rect x="117" y="170" width="110" height="40" rx="0" fill="#eaf2ff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="172.0" y="197" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">id</text>
<rect x="227" y="170" width="110" height="40" rx="0" fill="#eaf2ff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="282.0" y="197" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">b</text>
<rect x="337" y="170" width="110" height="40" rx="0" fill="#eaf2ff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="392.0" y="197" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">c</text>
<rect x="28" y="210" width="89" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="72.5" y="240" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">0</text>
<rect x="117" y="210" width="110" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="172.0" y="240" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">10</text>
<rect x="227" y="210" width="110" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="282.0" y="240" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">1</text>
<rect x="337" y="210" width="110" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="392.0" y="240" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">100</text>
<rect x="28" y="257" width="89" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="72.5" y="287" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">1</text>
