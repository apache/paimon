<text x="172.0" y="287" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">20</text>
<rect x="227" y="257" width="110" height="47" rx="0" fill="#fff2d7" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="282.0" y="287" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">2</text>
<rect x="337" y="257" width="110" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="392.0" y="287" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">200</text>
<rect x="28" y="304" width="89" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="72.5" y="334" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">2</text>
<rect x="117" y="304" width="110" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="172.0" y="334" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">30</text>
<rect x="227" y="304" width="110" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="282.0" y="334" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">3</text>
<rect x="337" y="304" width="110" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="392.0" y="334" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">300</text>
<path d="M 451 233 L 550 233" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 451 280 L 550 280" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 451 327 L 550 327" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="559" y="170" width="89" height="40" rx="0" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="603.5" y="197" font-size="18" font-weight="700" text-anchor="middle" fill="#526277">Row ID</text>
<rect x="648" y="170" width="90" height="40" rx="0" fill="#fff2d7" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="693.0" y="197" font-size="18" font-weight="700" text-anchor="middle" fill="#9a5200">b</text>
<rect x="559" y="210" width="89" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="603.5" y="240" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">0</text>
