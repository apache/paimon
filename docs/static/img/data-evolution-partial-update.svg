<text x="693" y="240" font-size="21" font-weight="700" text-anchor="middle" fill="#9a5200">1</text>
<text x="752" y="240" font-size="18" font-weight="400" text-anchor="start" fill="#526277">preserved</text>
<rect x="559" y="257" width="89" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="603.5" y="287" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">1</text>
<rect x="648" y="257" width="90" height="47" rx="0" fill="#fff2d7" stroke="#9a5200" stroke-width="1.5"/>
<text x="693" y="287" font-size="21" font-weight="700" text-anchor="middle" fill="#9a5200">22</text>
<text x="752" y="287" font-size="18" font-weight="400" text-anchor="start" fill="#9a5200">changed</text>
<rect x="559" y="304" width="89" height="47" rx="0" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="603.5" y="334" font-size="21" font-weight="400" text-anchor="middle" fill="#172b4d">2</text>
<rect x="648" y="304" width="90" height="47" rx="0" fill="#fff2d7" stroke="#9a5200" stroke-width="1.5"/>
<text x="693" y="334" font-size="21" font-weight="700" text-anchor="middle" fill="#9a5200">3</text>
<text x="752" y="334" font-size="18" font-weight="400" text-anchor="start" fill="#526277">preserved</text>
<text x="28" y="383" font-size="19" font-weight="700" text-anchor="start" fill="#2463b4">N0 stays unchanged.</text>
<text x="559" y="383" font-size="18" font-weight="700" text-anchor="start" fill="#9a5200">Same 3 positions. Only b is written.</text>
<rect x="28" y="411" width="844" height="70" rx="8" fill="#eaf2ff" stroke="#eaf2ff" stroke-width="1.5"/>
<text x="44" y="438" font-size="18" font-weight="400" text-anchor="start" fill="#2463b4">The predicate selects row 1, but N1 must still cover every row ID in [0, 2].</text>
<text x="44" y="463" font-size="18" font-weight="400" text-anchor="start" fill="#2463b4">Columns id and c continue to come from N0.</text>
</g>
</svg>
