<title id="title">Compaction and deletion materialization do different work</title>
<desc id="desc">Starting with a normal range 0 to 3 and row 1 logically deleted, ordinary compaction keeps all four positions and the deletion vector. Materialization removes the deleted position and rewrites the surviving rows with illustrative new row IDs 100, 101, and 102. Historical snapshots can retain replaced files.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526277"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b4d">
<rect x="1" y="1" width="898" height="659" rx="12" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="28" y="43" font-size="27" font-weight="700" text-anchor="start" fill="#172b4d">Compaction and deletion materialization do different work</text>
<text x="28" y="76" font-size="18" font-weight="400" text-anchor="start" fill="#526277">Example: row ID 1 is deleted. The latest table has 3 visible rows.</text>
<text x="153" y="129" font-size="17" font-weight="400" text-anchor="end" fill="#526277">Row ID</text>
<text x="153" y="171" font-size="17" font-weight="400" text-anchor="end" fill="#526277">Value</text>
