<rect x="635" y="309" width="98" height="39" rx="4" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="684.0" y="335" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">C</text>
<rect x="737" y="268" width="98" height="36" rx="4" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="786.0" y="293" font-size="20" font-weight="700" text-anchor="middle" fill="#172b4d">3</text>
<rect x="737" y="309" width="98" height="39" rx="4" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="786.0" y="335" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">D</text>
<text x="635" y="382" font-size="19" font-weight="700" text-anchor="middle" fill="#2463b4">Still [0, 3]; 3 visible rows</text>
<rect x="28" y="420" width="844" height="170" rx="8" fill="#e5f5ef" stroke="#10705d" stroke-width="1.5"/>
<text x="46" y="455" font-size="21" font-weight="700" text-anchor="start" fill="#10705d">Materialize deletion vectors</text>
<text x="46" y="484" font-size="18" font-weight="400" text-anchor="start" fill="#526277">Rewrite surviving rows.</text>
<text x="46" y="513" font-size="18" font-weight="400" text-anchor="start" fill="#526277">Remove applied deletion vector.</text>
<text x="476" y="465" font-size="17" font-weight="400" text-anchor="end" fill="#526277">Row ID</text>
<text x="476" y="507" font-size="17" font-weight="400" text-anchor="end" fill="#526277">Value</text>
<rect x="488" y="442" width="110" height="36" rx="4" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="543.0" y="467" font-size="20" font-weight="700" text-anchor="middle" fill="#172b4d">100</text>
<rect x="488" y="483" width="110" height="39" rx="4" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="543.0" y="509" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">A</text>
<rect x="602" y="442" width="110" height="36" rx="4" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="657.0" y="467" font-size="20" font-weight="700" text-anchor="middle" fill="#172b4d">101</text>
<rect x="602" y="483" width="110" height="39" rx="4" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="657.0" y="509" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">C</text>
<rect x="716" y="442" width="110" height="36" rx="4" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="771.0" y="467" font-size="20" font-weight="700" text-anchor="middle" fill="#172b4d">102</text>
<rect x="716" y="483" width="110" height="39" rx="4" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="771.0" y="509" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">D</text>
<text x="645" y="556" font-size="18" font-weight="700" text-anchor="middle" fill="#10705d">New IDs shown as [100, 102]</text>
<text x="450" y="627" font-size="18" font-weight="400" text-anchor="middle" fill="#526277">Replaced files can remain in historical snapshots until expiration.</text>
</g>
