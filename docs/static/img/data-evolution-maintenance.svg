<rect x="165" y="147" width="136" height="39" rx="4" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="233.0" y="173" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">A</text>
<rect x="305" y="106" width="136" height="36" rx="4" fill="#fff0f1" stroke="#b42332" stroke-width="1.5"/>
<text x="373.0" y="131" font-size="20" font-weight="700" text-anchor="middle" fill="#b42332">1</text>
<rect x="305" y="147" width="136" height="39" rx="4" fill="#fff0f1" stroke="#b42332" stroke-width="1.5"/>
<text x="373.0" y="173" font-size="18" font-weight="700" text-anchor="middle" fill="#b42332">deleted</text>
<line x1="319" y1="124" x2="427" y2="124" stroke="#b42332" stroke-width="2"/>
<rect x="445" y="106" width="136" height="36" rx="4" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="513.0" y="131" font-size="20" font-weight="700" text-anchor="middle" fill="#172b4d">2</text>
<rect x="445" y="147" width="136" height="39" rx="4" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="513.0" y="173" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">C</text>
<rect x="585" y="106" width="136" height="36" rx="4" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="653.0" y="131" font-size="20" font-weight="700" text-anchor="middle" fill="#172b4d">3</text>
<rect x="585" y="147" width="136" height="39" rx="4" fill="#eaf2ff" stroke="#2463b4" stroke-width="1.5"/>
<text x="653.0" y="173" font-size="18" font-weight="700" text-anchor="middle" fill="#2463b4">D</text>
<text x="445" y="213" font-size="19" font-weight="400" text-anchor="middle" fill="#526277">Current normal range [0, 3] + deletion vector {1}</text>
<rect x="28" y="246" width="844" height="155" rx="8" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="46" y="279" font-size="21" font-weight="700" text-anchor="start" fill="#2463b4">Ordinary compaction</text>
<text x="46" y="308" font-size="18" font-weight="400" text-anchor="start" fill="#526277">Consolidate files.</text>
<text x="46" y="337" font-size="18" font-weight="400" text-anchor="start" fill="#526277">Keep IDs and deletion vector.</text>
<text x="419" y="291" font-size="17" font-weight="400" text-anchor="end" fill="#526277">Row ID</text>
<text x="419" y="333" font-size="17" font-weight="400" text-anchor="end" fill="#526277">Value</text>
