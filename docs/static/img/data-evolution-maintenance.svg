<text x="582.0" y="335" font-size="18" font-weight="700" text-anchor="middle" fill="#b42332">deleted</text>
<line x1="547" y1="286" x2="617" y2="286" stroke="#b42332" stroke-width="2"/>
<rect x="635" y="268" width="98" height="36" rx="4" fill="#f5f7fb" stroke="#d7dfeb" stroke-width="1.5"/>
